name: Build CIA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-cia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply submodule patches
        # moonlight-common-c gains Apollo's server-command packet (see patches/)
        run: sh 3ds/apply-patches.sh
      - name: Build Dockerfile
        run: docker build --network=host -t moonlight-n3ds .
      - name: Build CIA
        # The full make output is kept as an artifact so a failed build can be
        # diagnosed without access to the job log.
        run: docker run --rm -v .:/moonlight-N3DS -w /moonlight-N3DS moonlight-n3ds:latest bash -c "make 2>&1 | tee build.log; exit \${PIPESTATUS[0]}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-buildlog
          path: ./build.log
          if-no-files-found: ignore
      - name: Export symbols
        # Sorted symbol table so a crash screen's PC/LR can be mapped to a
        # function without the toolchain (the code segment loads at 0x100000).
        run: docker run --rm -v .:/moonlight-N3DS -w /moonlight-N3DS moonlight-n3ds:latest bash -c "source /etc/profile.d/devkit-env.sh && \$DEVKITARM/bin/arm-none-eabi-nm -n -C moonlight.elf > symbols.txt"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: |
            ./*.cia
            ./*.3dsx
            ./*.elf
            ./symbols.txt
