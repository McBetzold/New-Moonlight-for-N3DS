## Moonlight for the New 3DS - settings file
##
## Lives at sd:/3ds/moonlight/moonlight.conf. Every option here can also be
## changed on the 3DS under Settings, which rewrites this file when you leave
## the settings page. Lines starting with # are ignored. The PC list is kept
## separately in sd:/3ds/moonlight/hosts.conf.

## ---- Video --------------------------------------------------------------

## Stream size and frame rate. 800x480 at 60 fps is the recommended default;
## the hardware decoder handles it with room to spare. 400x240 is the
## lightest to decode. Width should be a multiple of 400 or 320 and height a
## multiple of 240; nothing larger than 1024x512 can be shown.
#width = 800
#height = 480
#fps = 60

## Display size asked of the host instead of the stream size (0 = same as
## the stream). Apollo creates its virtual display at this size and scales the
## picture down, so games that won't run below HD still start. Keep it the
## same shape as the stream (1920x1152 for an 800x480 stream).
#host_width = 0
#host_height = 0

## Video bitrate in kbps; -1 picks one from the size and frame rate (3000 for
## 800x480 at 60 fps) when Moonlight starts. Leaving Settings saves that
## number, so set the bitrate again after changing the size or frame rate.
## Raise it on a strong connection for a sharper picture; the settings slider
## goes up to 20000.
#bitrate = -1

## 0 = hardware decoder (New 3DS), 1 = software (slow, original 3DS),
## 2 = disabled (audio only)
#video_decoder = 0

## Maximum size of video packets in bytes; leave at 1392 unless your network
## needs smaller packets
#packetsize = 1392

## ---- 3D ------------------------------------------------------------------

## Stereoscopic 3D on the top screen, turned on by raising the 3D slider
## off   - the slider is ignored and the stream is always 2D (default)
## sbs   - the host sends half side-by-side 3D (left-eye view squeezed into
##         the left half of the picture, right-eye view into the right half),
##         for example from ReShade's SuperDepth3D shader. Stream 800 wide so
##         each eye gets a full 400x240 picture.
## depth - any 2D stream: both eyes see the whole picture, offset so it sits
##         behind the screen like a window; the slider sets how far
#stereo_3d = off
## Give each eye the other eye's picture (fixes side-by-side 3D that looks
## inside out; in depth mode it brings the picture in front of the screen)
#swap_eyes = false

## ---- Audio ---------------------------------------------------------------

## Play the sound on the PC instead of the 3DS
#localaudio = false

## Gain applied on the 3DS, in percent (100-400). The speakers are quiet;
## keep it at 200 or below, since higher settings clip loud passages.
#volume_boost = 100

## ---- Host ----------------------------------------------------------------

## Let the host adjust in-game settings to match the stream
#sops = true

## Close the app on the PC when the stream ends
#quitappafter = false

## Reconnect by itself (up to three times) when a stream drops
#auto_reconnect = true

## On start-up, resume the app still running on a paired PC (after a
## three-second countdown that can be cancelled)
#resume_on_start = false

## A PC that uses a non-standard port is added as "address:port" in Add PC

## ---- Input ---------------------------------------------------------------

## Show the stream without sending any input to the PC
#viewonly = false

## Send the gyroscope and accelerometer to games that ask for motion input
#motion_controls = false

## Whatever is mapped to LT/RT clicks the left/right mouse buttons instead
#usetriggersformouse = false

## Holding START for a second turns the C-stick into a mouse pointer
#cstick_mouse = true

## Hold L3 while the Circle Pad is pushed nearly all the way (sprint in
## shooters); easing off below about 70% releases it
#auto_sprint = false

## Button mapping: what each 3DS button sends to the PC's controller.
## Buttons: a b x y l r zl zr start select
## Targets: a b x y lb rb lt rt view menu guide (HOME) l3 r3 l3r3 up down left
##          right capture (view + menu together, Capture through SwitchBridge)
##          none
## The example below is the "Xbox positions" layout (A/B and X/Y swapped).
#button_map = a=b,b=a,x=y,y=x,l=lb,r=rb,zl=lt,zr=rt,start=menu,select=view

## The five boxes of the bottom-screen gamepad view (same targets as above):
## three across the top, HOME and Capture side by side below
#touch_map = topleft=l3,topmiddle=l3r3,topright=r3,bottomleft=guide,bottomright=capture
